<div class="row mb-4 align-items-center">

  <div class="col">
    <h2 class="h4 text-muted">สินค้าทั้งหมด ({{ selectedCatList.length }} รายการ)</h2>
  </div>

  <div class="col-auto ms-auto">
    <select class="form-select form-select-sm d-inline-block w-auto" (change)="onSortChange($event)">
      <option value="recommended" selected>เรียงตาม: แนะนำ</option>
      <option value="price_asc">ราคาน้อยไปมาก</option>
      <option value="price_desc">ราคามากไปน้อย</option>
      <option value="newest">สินค้ามาใหม่</option>
    </select>
  </div>
</div>
<div class="row">
  <div class="col-6 col-md-4 col-lg-3 mb-4" *ngFor="let item of selectedCatList">

    <a  class="card h-100 product-card shadow-sm product-link" (click)="handleCardClick($event, item.id)">

      <div class="product-image-container">
        <img class="card-img-top" src="{{ item.image }}" alt="{{ item.name }}" loading="lazy">
      </div>

      <div class="card-body d-flex flex-column">
        <h5 class="card-title product-title">{{ item.name }}</h5>

        <p class="card-text mt-auto">
          <strong class="text-success h5">{{ item.price | currency: 'USD': true }}</strong>
        </p>

        <button type="button" (click)="addToCart(item); $event.stopPropagation()" class="btn btn-primary mt-2 add-to-cart-btn">
          <i class="bi bi-cart-plus-fill me-1"></i> เพิ่มลงตะกร้า
        </button>
      </div>
    </a>
  </div>
</div>
