<div class="row mb-4 align-items-center">
  <div class="col">
    <h2 class="h4 text-muted">
      สินค้าทั้งหมด ({{ selectedCatList.length }} รายการ)
    </h2>
  </div>

  <div class="col-auto ms-auto">
    <select class="form-select form-select-sm d-inline-block w-auto" (change)="onSortChange($event)">
      <option value="recommended" selected>เรียงตาม: แนะนำ</option>
      <option value="price_asc">ราคาน้อยไปมาก</option>
      <option value="price_desc">ราคามากไปน้อย</option>
      <option value="newest">สินค้ามาใหม่</option>
    </select>
  </div>
</div>

<div class="row" *ngIf="selectedCatList.length === 0">
  <div class="col-12 text-center py-5">
    <i class="bi bi-box-seam display-1 text-light"></i>
    <p class="text-muted mt-3">ขออภัย! ไม่พบสินค้าในหมวดหมู่นี้</p>
  </div>
</div>

<div class="row" *ngIf="selectedCatList.length > 0">
  <div class="col-6 col-md-4 col-lg-3 mb-4" *ngFor="let item of selectedCatList; trackBy: trackByProductId">

    <a class="card h-100 product-card shadow-sm product-link" (click)="handleCardClick($event, item.productId)">

      <div class="product-image-container">
        <!-- <img class="card-img-top" [src]="item.image" [alt]="item.productName" loading="lazy"> -->
        <img class="card-img-top"
            [src]="temp_img_url"
            [alt]="item.productName" loading="lazy">
      </div>

      <div class="card-body d-flex flex-column">
        <h5 class="card-title product-title">{{ item.productName }}</h5>

        <p class="card-text mt-auto">
          <strong class="text-success h5">{{ item.price | currency: 'THB': 'symbol': '1.0-2' }}</strong>
        </p>

        <button type="button"
                (click)="addToCart(item); $event.stopPropagation()"
                class="btn btn-primary mt-2 add-to-cart-btn">
          <i class="bi bi-cart-plus-fill me-1"></i> เพิ่มลงตะกร้า
        </button>
      </div>
    </a>
  </div>
</div>
