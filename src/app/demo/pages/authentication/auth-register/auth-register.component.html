<div class="auth-main petshop-bg">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header text-center mb-4">
        <div class="pet-logo-circle mb-2">
          <i class="fas fa-paw fa-3x text-orange"></i>
        </div>
        <h1 class="shop-title">Buddy Petshop</h1>
        <p class="text-muted">มาร่วมเป็นส่วนหนึ่งของครอบครัวเรากันเถอะ 🐾</p>
      </div>

      <div class="card auth-card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0 fw-bold color-primary">สมัครสมาชิก</h3>
            <a [routerLink]="['/login']" class="link-secondary small">มีบัญชีอยู่แล้ว? เข้าสู่ระบบ</a>
          </div>

          <div class="section-title mb-3">
            <h5 class="mb-0 text-orange"><i class="fas fa-user-circle me-2"></i>ข้อมูลส่วนตัว</h5>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold">ชื่อ-นามสกุล*</label>
            <input type="text" class="form-control rounded-pill" placeholder="ชื่อของคุณ"
              [(ngModel)]="registerData.customerName" name="customerName"
              [class.is-invalid]="errorMessage && !registerData.customerName" />
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold">รูปโปรไฟล์ (ถ้ามี)</label>
            <input type="file" class="form-control rounded-pill" (change)="onFileSelected($event, 'image')"
              accept="image/*" />
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">อีเมล*</label>
                <input type="email" class="form-control rounded-pill" placeholder="example@mail.com"
                  [(ngModel)]="registerData.email" name="email"
                  [class.is-invalid]="errorMessage && !registerData.email" />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">เบอร์โทรศัพท์</label>
                <input type="text" class="form-control rounded-pill" placeholder="08x-xxxxxxx"
                  [(ngModel)]="registerData.phone" name="phone" />
              </div>
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold">รหัสผ่าน*</label>
            <input type="password" class="form-control rounded-pill" placeholder="กำหนดรหัสผ่านของคุณ"
              [(ngModel)]="registerData.password" name="password"
              [class.is-invalid]="errorMessage && !registerData.password" />
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold">ที่อยู่สำหรับจัดส่ง</label>
            <textarea class="form-control rounded-20" rows="2" placeholder="บ้านเลขที่, ถนน, แขวง/ตำบล..."
              [(ngModel)]="registerData.address" name="address"></textarea>
          </div>

          <hr class="my-4 dashed-line">

          <div class="section-title mb-3">
            <h5 class="mb-0 text-success"><i class="fas fa-dog me-2"></i>ข้อมูลน้องสัตว์เลี้ยง</h5>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">ชื่อสัตว์เลี้ยง</label>
                <input type="text" class="form-control rounded-pill" placeholder="ชื่อน้องๆ"
                  [(ngModel)]="registerData.petName" name="petName" />
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">ประเภทสัตว์</label>
                <select class="form-select rounded-pill" [(ngModel)]="registerData.petType" name="petType">
                  <option value="DOG">🐶 สุนัข</option>
                  <option value="CAT">🐱 แมว</option>
                  <option value="GUINEA_PIG">🐹 หนูตะเภา</option>
                </select>
              </div>
            </div>
          </div>

          <div class="row">
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">วันเกิด</label>
                <input type="date" class="form-control rounded-pill" [(ngModel)]="registerData.petBirthdate"
                  name="petBirthdate">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">น้ำหนัก (kg)</label>
                <input type="number" step="0.1" class="form-control rounded-pill" [(ngModel)]="registerData.petWeight"
                  name="petWeight">
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">เพศ</label>
                <select class="form-select rounded-pill" [(ngModel)]="registerData.petGender" name="petGender">
                  <option value="MALE">ผู้</option>
                  <option value="FEMALE">เมีย</option>
                </select>
              </div>
            </div>
            <div class="col-md-6">
              <div class="form-group mb-3">
                <label class="form-label fw-bold">สายพันธุ์</label>
                <input type="text" class="form-control rounded-pill" placeholder="เช่น Golden Retriever"
                  [(ngModel)]="registerData.petBreed" name="petBreed">
              </div>
            </div>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold">รูปน้องหมา/แมว (ถ้ามี)</label>
            <input type="file" class="form-control rounded-pill" (change)="onFileSelected($event, 'petImage')"
              accept="image/*" />
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" [(ngModel)]="registerData.petIsSterilized"
              name="petIsSterilized" id="sterilizedCheck">
            <label class="form-check-label" for="sterilizedCheck">
              ทำหมันแล้ว
            </label>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold">โรคประจำตัว (ถ้ามี)</label>
            <select class="form-select rounded-pill" [(ngModel)]="registerData.congenitalDisease"
              name="congenitalDisease">
              @for (d of diseases; track d) {
              <option [value]="d">{{ d }}</option>
              }
            </select>
          </div>

          @if (errorMessage) {
          <div class="alert alert-danger-soft mt-3" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i> {{ errorMessage }}
          </div>
          }

          <p class="mt-4 text-center small text-muted">
            การสมัครสมาชิกถือว่าคุณยอมรับ
            <a href="javascript:" class="text-orange text-decoration-none">เงื่อนไขการใช้งาน</a> และ
            <a href="javascript:" class="text-orange text-decoration-none">นโยบายความเป็นส่วนตัว</a>
          </p>

          <div class="d-grid mt-4">
            <button type="button" class="btn btn-pet-primary btn-lg rounded-pill shadow-sm py-3" (click)="onRegister()"
              [disabled]="isLoading">
              @if (isLoading) {
              <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
              กำลังพาเข้าบ้าน...
              } @else {
              สมัครสมาชิก <i class="fas fa-paw ms-2"></i>
              }
            </button>
          </div>
        </div>
      </div>

      <div class="text-center mt-4">
        <small class="text-muted">ยินดีต้อนรับเพื่อนรักสี่ขาของท่าน ❤️</small>
      </div>
    </div>
  </div>
</div>
