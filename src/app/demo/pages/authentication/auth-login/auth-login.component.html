<div class="auth-main petshop-bg">
  <div class="auth-wrapper v3">
    <div class="auth-form">
      <div class="auth-header text-center mb-4">
        <div class="pet-logo-circle mb-2">
          <i class="fas fa-paw fa-3x text-orange"></i>
        </div>
        <h1 class="shop-title">Buddy Petshop</h1>
        <p class="text-muted">ยินดีต้อนรับคนรักสัตว์ทุกท่านครับ 🐶🐱</p>
      </div>

      <div class="card auth-card shadow-sm">
        <div class="card-body p-4">
          <div class="d-flex justify-content-between align-items-end mb-4">
            <h3 class="mb-0 fw-bold color-primary">เข้าสู่ระบบ</h3>
            <a [routerLink]="['/register']" class="link-secondary small">ยังไม่มีสมาชิก? สมัครเลย</a>
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold" for="email"><i class="fas fa-envelope me-1"></i> อีเมล</label>
            <input type="email" class="form-control rounded-pill" id="email" placeholder="example@email.com"
              [(ngModel)]="loginRequest.email" name="email" [class.is-invalid]="errorMessage" />
          </div>

          <div class="form-group mb-3">
            <label class="form-label fw-bold" for="password"><i class="fas fa-lock me-1"></i> รหัสผ่าน</label>
            <input type="password" class="form-control rounded-pill" id="password" placeholder="ใส่รหัสผ่านที่นี่"
              [(ngModel)]="loginRequest.password" name="password" [class.is-invalid]="errorMessage" />
          </div>

          @if (errorMessage) {
          <div class="alert alert-danger-soft mt-2" role="alert">
            <i class="fas fa-exclamation-circle me-2"></i> {{ errorMessage }}
          </div>
          }

          <div class="d-flex mt-1 justify-content-between align-items-center">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="customCheckc1" />
              <label class="form-check-label text-muted small" for="customCheckc1">จดจำฉันไว้</label>
            </div>
            <a href="javascript:" class="text-muted small">ลืมรหัสผ่าน?</a>
          </div>

          <div class="d-grid mt-4">
            <button type="button" class="btn btn-pet-primary btn-lg rounded-pill shadow-sm" (click)="onLogin()"
              [disabled]="isLoading">
              @if (isLoading) {
              <span class="spinner-border spinner-border-sm me-1" role="status" aria-hidden="true"></span>
              กำลังเดินเข้าหน้าเว็ป...
              } @else {
              เข้าบ้าน Buddy <i class="fas fa-home ms-1"></i>
              }
            </button>
          </div>

        </div>
      </div>

      <div class="text-center mt-4">
        <small class="text-muted">Made with ❤️ for your best friends</small>
      </div>
    </div>
  </div>
</div>
