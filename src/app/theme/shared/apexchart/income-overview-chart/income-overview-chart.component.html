<h5 class="mb-3 mt-2">ออเดอร์รายสัปดาห์</h5>
<app-card [showHeader]="false">
  <h6 class="mb-2 f-w-400 text-muted">สถิติ 7 วันล่าสุด</h6>
  <!-- <h3 class="mb-3">$7,650</h3> -->
  <apx-chart *ngIf="chartOptions" [series]="chartOptions.series" [chart]="chartOptions.chart"
    [plotOptions]="chartOptions.plotOptions" [dataLabels]="chartOptions.dataLabels" [xaxis]="chartOptions.xaxis"
    [colors]="chartOptions.colors" [stroke]="chartOptions.stroke" [yaxis]="chartOptions.yaxis"
    [grid]="chartOptions.grid" [tooltip]="chartOptions.tooltip"></apx-chart>
  <div class="text-center p-4" *ngIf="!chartOptions">
    <div class="spinner-border text-primary" role="status">
      <span class="visually-hidden">Loading...</span>
    </div>
  </div>
</app-card>
